memory_limit = 256M
; EC-CUBE 4.3 uses ${var} string interpolation, deprecated since PHP 8.2.
; index.php suppresses E_DEPRECATED for HTTP requests; bin/console does not,
; which trips a "headers already sent" error in NativeFileSessionHandler.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
[opcache]
opcache.enable_cli=1
opcache.jit_buffer_size=100M