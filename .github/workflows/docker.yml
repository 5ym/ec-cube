name: Update GitHub Container Registry

on:
  push:
  schedule:
    # 毎日 03:00 JST に EC-CUBE の最新リリースをチェックし、更新があれば再ビルドする
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      eccube_version:
        description: 'Build する EC-CUBE のリリースタグ (例: 4.2.3-p2)。空欄なら最新リリースを使用'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve EC-CUBE release version
        id: eccube
        run: |
          VERSION="${{ github.event.inputs.eccube_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/EC-CUBE/ec-cube/releases/latest | sed 's#.*/tag/##')
          fi
          echo "EC-CUBE version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.eccube.outputs.version }}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ECCUBE_VERSION=${{ steps.eccube.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
